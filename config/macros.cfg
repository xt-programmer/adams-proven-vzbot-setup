[gcode_macro PRINT_START]
gcode:
  {% set bed = params.BED|default(80)|float %}
  {% set hotend = params.HOTEND|default(250)|float %}

  BED_MESH_CLEAR
  SET_GCODE_OFFSET Z=0

  G90
  M83
  G92 E0
  
  M140 S{bed}
  M190 S{bed}

  M104 S130
  M109 S130
  
  G28

  CARTOGRAPHER_TOUCH_HOME
  BED_MESH_CALIBRATE

  M104 S{hotend}
  M109 S{hotend}

[gcode_macro OLD_PRINT_START]
gcode:
  BED_MESH_CLEAR
  {% set bed = params.BED|default(80)|float %}
  {% set hotend = params.HOTEND|default(250)|float %}
  
  G90
  M83
  G92 E0
  M140 S{bed}
  M190 S{bed}
  G4 P15000
  G28
  G28 Z
  
  BED_MESH_CALIBRATE PROBE_COUNT=3,3 ADAPTIVE=1

  #G1 Z2.0 F3000
  M104 S{hotend}
  M109 S{hotend}
  G92 E0

[gcode_macro PRINT_END]
gcode:
    M400
    G92 E0
    M83
    G1 E-1 F1000
    G91
    G1 Z20 F1500
    G90
    TURN_OFF_HEATERS
    G0  X10 Y300 F20000
    M107
    M220 S100
    M84

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
gcode:
  PAUSE_BASE
  G91
  G1 E-2 F2100
  G1 Z10 F1000
  G90
  G0 X10 Y300 F10000

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  M400
  G1 Z30 F600
  TURN_OFF_HEATERS
  CANCEL_PRINT_BASE
  M107
  M84

[gcode_macro M0]
gcode:
    PAUSE

[gcode_macro RSCS_FANS]
gcode:
  SET_FAN_SPEED FAN=RSCS SPEED={params.SPEED}
  SET_FAN_SPEED FAN=RSCS_1 SPEED={params.SPEED}

[gcode_macro M106]
rename_existing: G106
gcode:
    {% set P = params.P | default(0) | int %}
    {% set S = params.S | default(255) | int %}
    {% set speed = S / 255.0 %}

    {% if P == 0 %}
        G106 S{S}
    {% elif P == 2 %}
        SET_FAN_SPEED FAN=RSCS SPEED={speed}
        SET_FAN_SPEED FAN=RSCS_1 SPEED={speed}
    {% else %}
        SET_FAN_SPEED FAN=exhaust_fan SPEED={speed}
    {% endif %}


[gcode_macro M107]
rename_existing: G107
gcode:
    {% set P = params.P | default(0) | int %}

    {% if P == 2 %}
        SET_FAN_SPEED FAN=RSCS SPEED=0
        SET_FAN_SPEED FAN=RSCS_1 SPEED=0
#    {% elif P == 3 %}
#        SET_FAN_SPEED FAN=Exhaust_fan SPEED=0
    {% else %}
        SET_FAN_SPEED FAN=RSCS SPEED=0
        SET_FAN_SPEED FAN=RSCS_1 SPEED=0
#        SET_FAN_SPEED FAN=Exhaust_fan SPEED=0
        G107
    {% endif %}
