[include mainsail.cfg]
[include macros.cfg]
[include cartographer.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_unique_id
restart_method: command

[printer]
kinematics: corexy
max_velocity: 1250
max_accel: 60000
max_z_velocity: 25	
max_z_accel: 450
square_corner_velocity: 12

[exclude_object]
[gcode_arcs]

[idle_timeout]
timeout: 600

[temperature_sensor OrangePi]
sensor_type: temperature_host
min_temp: 5
max_temp: 80

[temperature_sensor Octopus]
sensor_type: temperature_mcu
min_temp: 5
max_temp: 80

[stepper_x]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200 
endstop_pin: PG9
position_endstop: 0
position_max: 330
homing_speed: 30
second_homing_speed: 10
homing_retract_dist: 3

[tmc5160 stepper_x]
interpolate: false #was false
run_current: 1.6
hold_current: 0.6
sense_resistor: 0.075
stealthchop_threshold: 0
cs_pin: PE4
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6

[stepper_x1]
step_pin: PE6
dir_pin: PA14
enable_pin: !PE0
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200  

[tmc5160 stepper_x1]
interpolate: false #was false
run_current: 1.6
hold_current: 0.6
sense_resistor: 0.075
stealthchop_threshold: 0
cs_pin: PD3
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6

[stepper_y]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200   
endstop_pin: PG10
position_endstop: 0
position_max: 300
homing_speed: 30
second_homing_speed: 10
homing_retract_dist: 3

[tmc5160 stepper_y]
interpolate: false #was false
run_current: 1.6
hold_current: 0.6
sense_resistor: 0.075
stealthchop_threshold: 0
cs_pin: PE1
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6

[stepper_y1]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200 

[tmc5160 stepper_y1]
interpolate: false #was false
run_current: 1.6
hold_current: 0.6
sense_resistor: 0.075
stealthchop_threshold: 0
cs_pin: PF2
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6

[safe_z_home]
z_hop: 8
z_hop_speed: 10
home_xy_position: 162, 122

[stepper_z]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 4
microsteps: 16
#endstop_pin: PG6
endstop_pin: probe:z_virtual_endstop
homing_retract_dist: 0
position_max: 400
position_min: 0
homing_speed: 10

[tmc5160 stepper_z]
cs_pin: PD11
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
run_current: 0.8
stealthchop_threshold: 0
interpolate: true #was false

[extruder]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 35.1
gear_ratio: 60:10
full_steps_per_rotation: 200
nozzle_diameter: 0.4
filament_diameter: 1.75
max_extrude_only_distance: 99999
max_extrude_cross_section: 2
heater_pin: PA0
sensor_type: PT1000
sensor_pin: PF4
min_temp: 0
max_temp: 360
max_power: 1
min_extrude_temp: 120
pressure_advance: 0.015
pressure_advance_smooth_time: 0.025
#control: pid
#pid_Kp: 19.112
#pid_Ki: 1.633
#pid_Kd: 55.902

[tmc5160 extruder]
cs_pin: PC4
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
run_current: 0.7
hold_current: 0.3
stealthchop_threshold: 0
interpolate: false

[heater_bed]
heater_pin: PB0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PF3
max_power: 0.8
min_temp: 5
max_temp: 125
#control: pid
#pid_Kp: 22.2
#pid_Ki: 1.08
#pid_Kd: 114

[fan]
pin: PG12
off_below: 0.20

[heater_fan fanHotend]
pin: PA8
heater_temp: 45

[fan_generic RSCS] #left
pin: PD13
kick_start_time: 2
off_below: 0.20
cycle_time: 0.01

[fan_generic RSCS_1] #right
pin: PD14
kick_start_time: 2
off_below: 0.20
cycle_time: 0.01

[fan_generic exhaust_fan]
pin: PD15
max_power: 1
shutdown_speed: 0.0
kick_start_time: 0.6
off_below: 0.16

[multi_pin chamber]
pins: PB11, PD12

[output_pin chamber_heater]
pin: multi_pin:chamber
value: 0
shutdown_value: 0

[input_shaper]
shaper_freq_x: 122.6
shaper_type_x: mzv
shaper_freq_y: 79.0
shaper_type_y: mzv

[temperature_sensor Chamber]
sensor_type: Generic 3950
sensor_pin: PF5
min_temp: 5
max_temp: 65

#[input_shaper]
#shaper_freq_x: 86.4
#shaper_type_x: mzv
#shaper_freq_y: 69.2
#shaper_type_y: mzv

