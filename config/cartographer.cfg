[cartographer]
mcu: cartographer
x_offset: 0
y_offset: 30.884
verbose: no

[mcu cartographer]
serial: /dev/serial/by-id/usb-Cartographer_stm32g431xx_unique_id
restart_method: command

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 100

[bed_mesh]
zero_reference_position: 162, 122
speed: 300
horizontal_move_z: 3
mesh_min: 29, 51 # The first probed coordinate, nearest to the origin. This coordinate is relative to the probe's location.
mesh_max: 305, 260 # The probed coordinate farthest from the origin. This is not necessarily the last point probed, as the probing process occurs in a zig-zag fashion. As with mesh_min, this coordinate is relative to the probe's location.
probe_count: 25, 25
adaptive_margin: 10
mesh_pps: 0,0 # Disable interpolation - mesh is probably dense enough

[adxl345]
cs_pin: cartographer:PA0 # For Cartographer V4
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345
probe_points:
    162, 122, 20
    
