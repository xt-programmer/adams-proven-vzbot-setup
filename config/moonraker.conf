[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: /home/**redacted**/printer_data/comms/klippy.sock

[authorization]
trusted_clients:
    192.168.0.0/16
    FC00::/7
    FE80::/10
    ::1/128
cors_domains:
    *.lan
    *.local
    **redacted**
    *://localhost
    *://localhost:*

[history]

[octoprint_compat]

[update_manager]
channel: dev
refresh_interval: 336

[update_manager mainsail]
path: /home/**redacted**/mainsail
repo: mainsail-crew/mainsail
channel: stable
type: web
persistent_files:
    config.json

[update_manager mainsail-config]
managed_services: klipper
origin: https://github.com/mainsail-crew/mainsail-config.git
path: /home/**redacted**/mainsail-config
primary_branch: master
type: git_repo

[update_manager cartographer_plugin]
type: python
channel: stable
virtualenv: ~/klippy-env
project_name: cartographer3d-plugin
is_system_service: False
managed_services: klipper
info_tags: desc=Cartographer Plugin